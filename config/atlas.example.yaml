atlas:
  name: Atlas OS
  release: 0.2-foundation
  assistant: Orion
  host: 0.0.0.0
  port: 8643

infrastructure:
  domain: home.arpa

proxmox:
  host: proxmox.home.arpa
  port: 8006
  node: your-proxmox-node
  verify_ssl: false

home_assistant:
  url: http://ha.home.arpa:8123

docker:
  socket: unix:///var/run/docker.sock

inventory:
  file: /opt/atlas/inventory/services.yaml

audit:
  database: /opt/atlas/data/action_history.db
  max_entries: 5000
  retention_days: 90

intelligence:
  provider_timeout_seconds: 10
