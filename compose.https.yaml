services:
  atlas-edge:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    user: "${ATLAS_EDGE_UID:-101}"
    restart: unless-stopped
    depends_on:
      atlas-agent:
        condition: service_healthy
      mission-control:
        condition: service_healthy
    ports:
      - "${ATLAS_HTTPS_BIND:-0.0.0.0}:${ATLAS_HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/docker/atlas-edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ATLAS_TLS_CERT_FILE:?set ATLAS_TLS_CERT_FILE}:/etc/atlas/tls/tls.crt:ro
      - ${ATLAS_TLS_KEY_FILE:?set ATLAS_TLS_KEY_FILE}:/etc/atlas/tls/tls.key:ro
      - ${ATLAS_HTPASSWD_FILE:?set ATLAS_HTPASSWD_FILE}:/etc/atlas/auth/htpasswd:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
