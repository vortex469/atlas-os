server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/atlas/tls/tls.crt;
    ssl_certificate_key /etc/atlas/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AtlasTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    auth_basic "Atlas Mission Control";
    auth_basic_user_file /etc/atlas/auth/htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://mission-control:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
