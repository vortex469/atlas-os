name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  atlas-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/atlas-agent/requirements.txt
            services/atlas-agent/requirements-dev.txt

      - name: Install Atlas Agent
        working-directory: services/atlas-agent
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint Atlas Agent
        run: ./scripts/rc1-python-ruff-gate services/atlas-agent

      - name: Test Atlas Agent
        run: PYTHONPATH=services/atlas-agent python -m pytest -q services/atlas-agent/tests

  atlas-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/atlas-core/requirements.txt
            services/atlas-core/requirements-dev.txt

      - name: Install Atlas Core
        working-directory: services/atlas-core
        run: python -m pip install --requirement requirements-dev.txt

      - name: Provide a physical test install root
        run: |
          sudo install --directory --mode=0755 /opt/atlas/config
          sudo install --mode=0644 config/atlas.yaml /opt/atlas/config/atlas.yaml

      - name: Lint changed Atlas Core files
        run: ./scripts/rc1-python-ruff-gate services/atlas-core

      - name: Test Atlas Core
        working-directory: services/atlas-core
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/atlas-core
        run: pytest -q

  mission-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: services/mission-control/package-lock.json

      - name: Install Mission Control
        working-directory: services/mission-control
        run: npm ci

      - name: Test Mission Control
        working-directory: services/mission-control
        run: npm test

      - name: Lint Mission Control
        working-directory: services/mission-control
        run: npm run lint

      - name: Build Mission Control
        working-directory: services/mission-control
        run: npm run build
