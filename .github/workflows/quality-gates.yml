name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  atlas-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/atlas-agent/requirements.txt
            services/atlas-agent/requirements-dev.txt

      - name: Install Atlas Agent
        working-directory: services/atlas-agent
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint Atlas Agent
        run: ./scripts/rc1-python-ruff-gate services/atlas-agent

      - name: Test Atlas Agent
        run: PYTHONPATH=services/atlas-agent python -m pytest -q services/atlas-agent/tests

      - name: Check bounded worker execution
        run: |
          python -m ruff check services/atlas-execution-worker/atlas_execution_worker services/atlas-execution-worker/healthcheck.py services/atlas-execution-worker/tests/test_healthcheck.py services/atlas-execution-worker/tests/test_relay.py services/atlas-execution-worker/tests/test_config.py services/atlas-execution-worker/tests/test_durable_ledger.py services/atlas-execution-worker/tests/test_process.py services/atlas-execution-worker/tests/test_workspace_runner.py services/atlas-execution-worker/tests/test_worker.py services/atlas-execution-worker/tests/test_isolation.py services/atlas-execution-worker/tests/test_diagnostics.py services/atlas-execution-worker/tests/probe_bounded_process.py services/atlas-execution-worker/tests/probe_nested_sandbox.py services/atlas-execution-worker/tests/probe_runtime_isolation.py
          PYTHONPATH=services/atlas-agent:services/atlas-execution-worker python -m pytest -q services/atlas-execution-worker/tests
          PYTHONPATH=services/atlas-agent:services/atlas-execution-worker python services/atlas-execution-worker/tests/probe_bounded_process.py

      - name: Test bounded worker ledger export
        run: |
          python -m ruff check scripts/atlas-worker-ledger-export scripts/test_atlas_worker_ledger_export.py scripts/atlas-repository-action-check scripts/atlas_repository_fixture_guard.py scripts/test_atlas_repository_action_check.py scripts/atlas_repository_fixture_source.py scripts/test_atlas_repository_fixture_source.py
          python -m pytest -q scripts/test_atlas_worker_ledger_export.py scripts/test_atlas_repository_action_check.py scripts/test_atlas_repository_fixture_source.py
          python scripts/atlas-repository-action-check --phase all --output-dir "$RUNNER_TEMP/atlas-repository-fixture"
          python scripts/atlas-repository-action-check --verify-report "$RUNNER_TEMP/atlas-repository-fixture/report.json"

  atlas-core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        core-shard: [0, 1, 2, 3]

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/atlas-core/requirements.txt
            services/atlas-core/requirements-dev.txt

      - name: Install Atlas Core
        working-directory: services/atlas-core
        run: python -m pip install --requirement requirements-dev.txt

      - name: Provide a physical test install root
        run: |
          sudo install --directory --mode=0755 /opt/atlas/config
          sudo install --mode=0644 config/atlas.yaml /opt/atlas/config/atlas.yaml
          sudo install --directory --owner="$(id -u)" --group="$(id -g)" --mode=0755 /opt/atlas/data /opt/atlas/logs

      - name: Lint changed Atlas Core files
        run: ./scripts/rc1-python-ruff-gate services/atlas-core

      - name: Test Atlas Core (shard ${{ matrix.core-shard }})
        working-directory: services/atlas-core
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/atlas-core
          CORE_SHARD: ${{ matrix.core-shard }}
          CORE_SHARD_COUNT: 4
        run: |
          pytest --collect-only -q > .core-collection.txt
          mapfile -t all_core_nodes < <(
            awk '/^(app|tests)\/.*::/ { print }' .core-collection.txt
          )
          test "${#all_core_nodes[@]}" -gt 0
          mapfile -t core_nodes < <(
            printf '%s\n' "${all_core_nodes[@]}" \
              | awk -v shard="$CORE_SHARD" -v count="$CORE_SHARD_COUNT" \
                  '((NR - 1) % count) == shard'
          )
          test "${#core_nodes[@]}" -gt 0
          pytest -vv --tb=long --durations=25 -o faulthandler_timeout=300 "${core_nodes[@]}"

  mission-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: services/mission-control/package-lock.json

      - name: Install Mission Control
        working-directory: services/mission-control
        run: npm ci

      - name: Test Mission Control
        working-directory: services/mission-control
        run: npm test

      - name: Lint Mission Control
        working-directory: services/mission-control
        run: npm run lint

      - name: Build Mission Control
        working-directory: services/mission-control
        run: npm run build

      - name: Install browser test runtime
        working-directory: services/mission-control
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Test Mission Control operator journeys
        id: browser-tests
        working-directory: services/mission-control
        run: npm run test:e2e -- --workers=2 --output="$RUNNER_TEMP/mission-control-browser-results"

      - name: Test built Mission Control navigation
        id: built-browser-tests
        working-directory: services/mission-control
        run: npm run test:e2e:built -- --workers=2 --output="$RUNNER_TEMP/mission-control-browser-results/built"

      - name: Preserve browser failure evidence
        if: failure() && (steps.browser-tests.outcome == 'failure' || steps.built-browser-tests.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mission-control-browser-failures
          path: ${{ runner.temp }}/mission-control-browser-results
          retention-days: 7
          if-no-files-found: ignore
