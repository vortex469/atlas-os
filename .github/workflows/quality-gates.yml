name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  atlas-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/atlas-core/requirements.txt
            services/atlas-core/requirements-dev.txt

      - name: Install Atlas Core
        working-directory: services/atlas-core
        run: python -m pip install --requirement requirements-dev.txt

      - name: Provide the production install path
        run: sudo ln --symbolic "$GITHUB_WORKSPACE" /opt/atlas

      - name: Test Atlas Core
        working-directory: services/atlas-core
        run: pytest -q

  mission-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: services/mission-control/package-lock.json

      - name: Install Mission Control
        working-directory: services/mission-control
        run: npm ci

      - name: Test Mission Control
        working-directory: services/mission-control
        run: npm test

      - name: Lint Mission Control
        working-directory: services/mission-control
        run: npm run lint

      - name: Build Mission Control
        working-directory: services/mission-control
        run: npm run build
