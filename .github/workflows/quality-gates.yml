name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  atlas-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Atlas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/atlas-core/requirements.txt
            services/atlas-core/requirements-dev.txt

      - name: Install Atlas Core
        working-directory: services/atlas-core
        run: python -m pip install --requirement requirements-dev.txt

      - name: Provide the production install path
        run: sudo ln --symbolic "$GITHUB_WORKSPACE" /opt/atlas

      - name: Test Atlas Core
        working-directory: services/atlas-core
        run: pytest -q

  mission-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Atlas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: services/mission-control/package-lock.json

      - name: Install Mission Control
        working-directory: services/mission-control
        run: npm ci

      - name: Test Mission Control
        working-directory: services/mission-control
        run: npm test

      - name: Lint Mission Control
        working-directory: services/mission-control
        run: npm run lint

      - name: Build Mission Control
        working-directory: services/mission-control
        run: npm run build
