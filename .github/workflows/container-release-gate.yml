name: Container release gate

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "compose.production.yaml"
      - "compose.https.yaml"
      - "config/**"
      - "deploy/docker/**"
      - "deploy/systemd/**"
      - "inventory/**"
      - "scripts/container-release-gate"
      - "scripts/atlas-data-*"
      - "scripts/data-recovery-gate"
      - "scripts/install-backup-timer"
      - "services/atlas-core/**"
      - "services/mission-control/**"
      - ".github/workflows/container-release-gate.yml"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "compose.production.yaml"
      - "compose.https.yaml"
      - "config/**"
      - "deploy/docker/**"
      - "deploy/systemd/**"
      - "inventory/**"
      - "scripts/container-release-gate"
      - "scripts/atlas-data-*"
      - "scripts/data-recovery-gate"
      - "scripts/install-backup-timer"
      - "services/atlas-core/**"
      - "services/mission-control/**"
      - ".github/workflows/container-release-gate.yml"

permissions:
  contents: read

jobs:
  production-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run container release gate
        run: ./scripts/container-release-gate
