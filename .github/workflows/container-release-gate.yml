name: Container release gate

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "compose.production.yaml"
      - "compose.https.yaml"
      - "config/**"
      - "deploy/docker/**"
      - "deploy/systemd/**"
      - "inventory/**"
      - "scripts/container-release-gate"
      - "scripts/atlas-data-*"
      - "scripts/data-recovery-gate"
      - "scripts/atlas_data_recovery_evidence.py"
      - "scripts/atlas_data_legacy_recovery_evidence.py"
      - "scripts/atlas_data_recovery_runtime_evidence.py"
      - "scripts/operational-capability-parity"
      - "scripts/install-backup-timer"
      - "services/atlas-agent/**"
      - "services/atlas-core/**"
      - "services/mission-control/**"
      - "docs/RELEASE_CHECKLIST.md"
      - ".github/workflows/container-release-gate.yml"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "compose.production.yaml"
      - "compose.https.yaml"
      - "config/**"
      - "deploy/docker/**"
      - "deploy/systemd/**"
      - "inventory/**"
      - "scripts/container-release-gate"
      - "scripts/atlas-data-*"
      - "scripts/data-recovery-gate"
      - "scripts/atlas_data_recovery_evidence.py"
      - "scripts/atlas_data_legacy_recovery_evidence.py"
      - "scripts/atlas_data_recovery_runtime_evidence.py"
      - "scripts/operational-capability-parity"
      - "scripts/install-backup-timer"
      - "services/atlas-agent/**"
      - "services/atlas-core/**"
      - "services/mission-control/**"
      - "docs/RELEASE_CHECKLIST.md"
      - ".github/workflows/container-release-gate.yml"

permissions:
  contents: read

jobs:
  production-containers:
    name: Container integration (runc; no gVisor proof)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Atlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run container integration gate
        env:
          ATLAS_CONTAINER_GATE_MODE: github-integration
        run: ./scripts/container-release-gate
